apiVersion: apps/v1
kind: Deployment
metadata:
  name: velos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velos-api
  template:
    metadata:
      labels:
        app: velos-api
    spec:
      containers:
        - name: api
          image: adouke/velos-api:1.0
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velos-db-secret
                  key: password
            - name: DATABASE_URL
              value: "postgresql://velos_user:$(DB_PASSWORD)@velos-base:5432/velos"
          readinessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: velos-api
spec:
  type: NodePort
  selector:
    app: velos-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081