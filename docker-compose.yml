services:
  base:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velos
      POSTGRES_USER: velos_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - velos_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velos_user -d velos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: velos-api:1.0
    environment:
      DATABASE_URL: postgresql://velos_user:${DB_PASSWORD}@base:5432/velos
    ports:
      - "8001:8000"
    depends_on:
      base:
        condition: service_healthy

volumes:
  velos_data: